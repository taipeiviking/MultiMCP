# multimcp-signal — thin MCP server bridging Signal messenger for MultiMCP.
#
# Not published to PyPI: the app ships this directory as a resource and the
# client configs launch it with the bundled uv (`uvx --from <this dir>
# multimcp-signal`), exactly parallel to how workspace-mcp is launched. Keeping
# it in-repo means the server can never drift from the app version that wrote
# the config.

[project]
name = "multimcp-signal"
version = "0.1.0"
description = "MCP server exposing Signal messenger (via a shared signal-cli JSON-RPC daemon) to AI clients."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 2.0 renamed FastMCP to MCPServer (mcp.server.mcpserver) — we use that API.
    "mcp>=2.0.0",
]

[project.scripts]
multimcp-signal = "multimcp_signal.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimcp_signal"]
