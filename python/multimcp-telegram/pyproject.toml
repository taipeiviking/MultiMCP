# multimcp-telegram — Telegram connector for MultiMCP (Telethon-based).
#
# Two entry points from one package:
#   multimcp-telegram         the MCP stdio server AI clients launch
#   multimcp-telegram-daemon  the ONE shared process that owns the Telethon
#                             session (sessions cannot be used concurrently)
#
# Launched with `uv run --project <this dir>` (editable, re-synced every run) —
# same rationale as multimcp-signal: uvx tool envs serve stale code.

[project]
name = "multimcp-telegram"
version = "0.1.0"
description = "MCP server exposing the user's own Telegram account (MTProto via Telethon) to AI clients."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "telethon>=1.44.0",
    # native AES for MTProto — without it Telethon warns and falls back to slow pure-python
    "cryptg>=0.5",
]

[project.scripts]
multimcp-telegram = "multimcp_telegram.server:main"
multimcp-telegram-daemon = "multimcp_telegram.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimcp_telegram"]
